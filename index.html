
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXTMART - Digital Store</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f6fa;color:#17243b;font-family:Arial,sans-serif}
header{background:white;padding:15px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5;border-bottom:1px solid #e5e9ef}
.logo{font-size:23px;font-weight:900;color:#14264a}.logo span{color:#f49a45}
button{cursor:pointer;font:inherit}
.menu{border:1px solid #ddd;background:white;border-radius:9px;padding:9px 13px;font-size:22px}
main{max-width:950px;margin:auto;padding:18px}
.hero{background:linear-gradient(120deg,#101d3b,#294875);color:white;border-radius:18px;padding:25px;margin-bottom:22px}
.hero h1{font-size:27px}.hero p{color:#d8e1ee;font-size:13px}
.search{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;margin-bottom:20px}
h2{font-size:19px}
.categories,.games{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.category,.game{background:white;border:1px solid #e7eaf0;border-radius:13px;padding:14px;text-align:center}
.category{font-weight:bold}
.game{display:flex;align-items:center;gap:10px;text-align:left;min-width:0}
.game img{width:48px;height:48px;object-fit:cover;border-radius:11px;background:#edf0f5}
.game b{font-size:12px}
.hidden{display:none!important}
.back{padding:9px 13px;border:0;background:#e9edf4;border-radius:8px;margin-bottom:15px}
#overlay{display:none;position:fixed;inset:0;background:#0007;z-index:10}
#overlay.open{display:block}
.drawer{float:right;background:white;width:280px;height:100%;padding:22px}
.drawer button{display:block;width:100%;padding:15px;margin:8px 0;text-align:left;background:white;border:1px solid #eee;border-radius:9px}
.panel{background:white;padding:18px;border-radius:13px}
input{width:100%;padding:12px;border:1px solid #ddd;border-radius:9px;margin:8px 0}
.primary{background:#14264a;color:white;border:0;border-radius:9px;padding:13px;width:100%;margin-top:12px}
footer{text-align:center;background:#101d3b;color:white;padding:25px;font-size:12px}
@media(max-width:600px){.categories,.games{grid-template-columns:repeat(2,1fr)}main{padding:13px}.game{padding:9px;gap:7px}.game img{width:40px;height:40px}}
</style>
</head>
<body>
<header>
 <div class="logo">NEXT<span>MART</span></div>
 <button class="menu" onclick="openMenu()">☰</button>
</header>

<div id="overlay" onclick="closeMenu()">
 <div class="drawer" onclick="event.stopPropagation()">
  <h3>NEXTMART</h3>
  <button onclick="showPage('Profil')">♙ Profil</button>
  <button onclick="showPage('Login / Daftar')">↪ Login / Daftar</button>
  <button onclick="showPage('Bonus & Promo')">◇ Bonus & Promo</button>
  <button onclick="showPage('Riwayat Pesanan')">▤ Riwayat Pesanan</button>
  <a href="https://t.me/lovdmxzz">Customer Service Telegram</a>
  <button onclick="closeMenu()">Tutup</button>
 </div>
</div>

<main>
<section id="home">
 <div class="hero">
  <small>YOUR DIGITAL STORE</small>
  <h1>Semua kebutuhan digital, lebih praktis.</h1>
  <p>Top up game, pulsa, paket data, token PLN dan e-wallet.</p>
 </div>
 <input class="search" id="search" placeholder="Cari game..." oninput="searchGames()">
 <h2>Kategori</h2>
 <div class="categories">
  <button class="category" onclick="showGames()">🎮<br>GAME</button>
  <button class="category" onclick="showProviders('PULSA')">📱<br>PULSA</button>
  <button class="category" onclick="showProviders('PAKET DATA')">🌐<br>PAKET DATA</button>
  <button class="category" onclick="showProviders('TOKEN PLN')">⚡<br>TOKEN PLN</button>
  <button class="category" onclick="showProviders('E-WALLET')">👛<br>E-WALLET</button>
 </div>
</section>

<section id="catalog" class="hidden">
 <button class="back" onclick="goHome()">← Kembali</button>
 <h2 id="catalogTitle">GAME</h2>
 <div class="games" id="gameList"></div>
</section>

<section id="detail" class="hidden">
 <button class="back" onclick="goCatalog()">← Kembali</button>
 <div class="panel">
  <h2 id="selectedGame"></h2>
  <label>ID / Nomor Tujuan</label>
  <input id="target" placeholder="Masukkan ID atau nomor">
  <h3>Pilih Nominal</h3>
  <div id="amounts"></div>
  <button class="primary" onclick="demoOrder()">Lanjutkan</button>
  <p style="font-size:12px;color:#777">Transaksi belum aktif. Supplier dan pembayaran belum diintegrasikan.</p>
 </div>
</section>

<section id="account" class="hidden">
 <button class="back" onclick="goHome()">← Kembali</button>
 <div class="panel"><h2 id="accountTitle"></h2><p id="accountText"></p></div>
</section>
</main>

<footer>
 <b>NEXTMART</b><br><br>
 © DAMM STORE
</footer>

<script>
// Daftar game dan sumber ikon masing-masing.
// URL gambar dapat diperbarui jika publisher mengganti asetnya.
const games=[
 {name:"Mobile Legends",icon:"https://play-lh.googleusercontent.com/0uJ3S9b9G8f2Fv8F8m7k3f5n"},
 {name:"Free Fire",icon:"https://play-lh.googleusercontent.com/8f8q9v3m2j"},
 {name:"PUBG Mobile",icon:"https://play-lh.googleusercontent.com/7x7f3v9m2k"},
 {name:"Call of Duty Mobile",icon:"https://play-lh.googleusercontent.com/3m9f8v2k"},
 {name:"Genshin Impact",icon:"https://play-lh.googleusercontent.com/9k2m7v4f"},
 {name:"Honkai Star Rail",icon:"https://play-lh.googleusercontent.com/2v8f6m3k"},
 {name:"Roblox",icon:"https://play-lh.googleusercontent.com/5f7m3k9v"},
 {name:"Arena of Valor",icon:"https://play-lh.googleusercontent.com/4k8m2v6f"},
 {name:"Honkai Impact 3",icon:"https://play-lh.googleusercontent.com/6m2v9k4f"},
 {name:"League of Legends Wild Rift",icon:"https://play-lh.googleusercontent.com/7k3m8v2f"},
 {name:"Minecraft",icon:"https://play-lh.googleusercontent.com/2m6v9k3f"},
 {name:"Stumble Guys",icon:"https://play-lh.googleusercontent.com/8v4m2k6f"}
];

const providers={
 "PULSA":["Telkomsel","Indosat","XL","AXIS","Tri","Smartfren"],
 "PAKET DATA":["Telkomsel","Indosat","XL","AXIS","Tri","Smartfren"],
 "TOKEN PLN":["Token PLN"],
 "E-WALLET":["DANA","OVO","GoPay","ShopeePay"]
};

let selected="",lastPage="catalog";

function openMenu(){document.getElementById("overlay").classList.add("open")}
function closeMenu(){document.getElementById("overlay").classList.remove("open")}
function show(id){
 ["home","catalog","detail","account"].forEach(x=>document.getElementById(x).classList.add("hidden"));
 document.getElementById(id).classList.remove("hidden");
 window.scrollTo(0,0);
}
function goHome(){show("home")}
function goCatalog(){show("catalog")}
function showGames(){
 lastPage="catalog";
 document.getElementById("catalogTitle").textContent="PILIH GAME";
 renderGames(games);
 show("catalog");
}
function renderGames(list){
 document.getElementById("gameList").innerHTML=list.map(g=>`
 <button class="game" onclick="chooseGame('${g.name.replace(/'/g,"\\'")}')">
 <img src="${g.icon}" alt="${g.name}" onerror="this.src='https://placehold.co/96x96/e9edf4/14264a?text=GAME'">
 <b>${g.name}</b></button>`).join("");
}
function searchGames(){
 const q=document.getElementById("search").value.toLowerCase();
 if(!q)return;
 showGames();
 renderGames(games.filter(g=>g.name.toLowerCase().includes(q)));
}
function chooseGame(name){
 selected=name;
 document.getElementById("selectedGame").textContent=name;
 document.getElementById("target").value="";
 document.getElementById("amounts").innerHTML=["5.000","10.000","20.000","50.000","100.000","200.000"].map(n=>
 `<button class="back" onclick="pickAmount(this,'${n}')">Rp ${n}</button>`).join("");
 show("detail");
}
let amount="";
function pickAmount(el,n){
 amount=n;
 document.querySelectorAll("#amounts button").forEach(b=>b.style.background="#e9edf4");
 el.style.background="#ffd9b2";
}
function showProviders(type){
 document.getElementById("catalogTitle").textContent=type;
 document.getElementById("gameList").innerHTML=providers[type].map(n=>
 `<button class="game" onclick="chooseGame('${n}')"><b>${n}</b></button>`).join("");
 show("catalog");
}
function showPage(name){
 closeMenu();
 document.getElementById("accountTitle").textContent=name;
 const messages={
 "Profil":"Profil pengguna akan tersedia setelah sistem akun aktif.",
 "Login / Daftar":"Fitur login dan pendaftaran belum aktif. Backend akun perlu disiapkan.",
 "Bonus & Promo":"Promo NEXTMART akan ditampilkan di sini.",
 "Riwayat Pesanan":"Riwayat transaksi tersedia setelah backend dan supplier terhubung."
 };
 document.getElementById("accountText").textContent=messages[name];
 show("account");
}
function demoOrder(){
 if(!document.getElementById("target").value.trim())return alert("Isi ID atau nomor tujuan.");
 if(!amount)return alert("Pilih nominal.");
 alert("Ini masih demo. Transaksi belum dikirim ke supplier.");
}
</script>
</body>
</html>
