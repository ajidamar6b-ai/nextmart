<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NEXTMART - Top Up Digital</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6fb;
      color: #17233d;
    }
    header {
      background: #101d3a;
      color: white;
      padding: 28px 20px;
      text-align: center;
    }
    header h1 { margin: 0; font-size: 32px; }
    header p { color: #ff9b35; }
    main { max-width: 700px; margin: 35px auto; padding: 20px; }
    h2 { text-align: center; }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }
    .item {
      background: white;
      padding: 25px 12px;
      border-radius: 14px;
      text-align: center;
      font-weight: bold;
      box-shadow: 0 3px 12px #00000010;
    }
    .notice {
      margin-top: 25px;
      padding: 16px;
      background: #fff1df;
      border-radius: 12px;
      text-align: center;
    }
    footer { text-align: center; padding: 25px; color: #68738a; }
  </style>
</head>
<body>
  <header>
    <h1>NEXTMART</h1>
    <p>Everything You Need, One Place.</p>
  </header>
  <main>
    <h2>Layanan Digital</h2>
    <div class="grid">
      <div class="item">📱 Pulsa</div>
      <div class="item">📶 Paket Data</div>
      <div class="item">⚡ Token PLN</div>
      <div class="item">💳 E-Wallet</div>
      <div class="item">🎮 Voucher Game</div>
      <div class="item">🧾 Tagihan PPOB</div>
    </div>
    <div class="notice">
      <strong>NEXTMART sedang dalam persiapan.</strong>
      <p>Layanan transaksi akan segera hadir.</p>
    </div>
  </main>
  <footer>© 2026 NEXTMART</footer>
<div style="position:fixed;bottom:10px;right:12px;font-size:11px;font-weight:bold;letter-spacing:2px;color:#17233d;opacity:0.45;z-index:9999;pointer-events:none;">
  DAMM STORE
</div>
</body>
</html>
